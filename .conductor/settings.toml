"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "npm install && uv sync --project backend"
run_mode = "concurrent"

[scripts.run.dev]
command = "FRONTEND_PORT=$CONDUCTOR_PORT BACKEND_PORT=$((CONDUCTOR_PORT + 1)) npm run dev"
default = true
icon = "play"

[scripts.run.test]
command = "npm test"
icon = "test-tube"

