[project]
name = "emed-backend"
version = "0.1.0"
description = "FastAPI backend for the Gutsy IBD companion demo"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=48.0.1,<49.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "runware-sdk>=1.6.5",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.34.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.0.0,<3.0.0",
    "pytest>=8.3.0,<9.0.0",
    "ruff>=0.11.0,<1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
